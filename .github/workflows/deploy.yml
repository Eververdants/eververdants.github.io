name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # refresh-repos.yml 每天 02:00 UTC 用 GITHUB_TOKEN 提交 repos.json，
    # 而 GITHUB_TOKEN 触发的 push 不会连带触发其它 workflow —— 自动收录
    # 的新仓库不会因那次提交而部署。补一个稍后的定时部署兜底，保证
    # 刷新的数据当天上线（内容无变化时等同一次空部署，代价可忽略）。
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # npm run build cannot fail on a broken prerender: scripts/prerender.mjs
      # ends in process.exit(0) unconditionally so a missing Chrome degrades to
      # a warning instead of a red deploy. That safety is also how a build can
      # ship with no sitemap, no RSS and no article pages and still go green —
      # which happened. Assert the artefacts exist rather than trust the exit
      # code.
      - name: Assert SEO artefacts
        run: |
          set -euo pipefail
          missing=0
          for f in sitemap.xml robots.txt rss.xml search.json site.json posts.json works.json llms-full.txt llms.txt 404.html sw.js; do
            if [ -s "dist/$f" ]; then echo "ok   dist/$f"; else echo "MISS dist/$f"; missing=1; fi
          done
          # { ... || true; } rather than a bare find: pipefail propagates find's
          # non-zero status when the starting path is missing, and set -e then
          # aborts the step at the assignment -- which is exactly the case this
          # step exists to report. Guarded, the count reads 0 and the checks
          # below still run.
          articles=$( { find dist/blog -mindepth 1 -maxdepth 1 -type d ! -name zh ! -name topic 2>/dev/null || true; } | wc -l )
          zh=$( { find dist/blog/zh -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true; } | wc -l )
          topics=$( { find dist/blog/topic -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true; } | wc -l )
          echo "prerendered article dirs: en=$articles zh=$zh topics=$topics"
          if [ "$articles" -lt 6 ] || [ "$zh" -lt 6 ]; then
            echo "::error::prerender produced fewer article pages than expected — headless Chrome likely unavailable or the pass crashed"
            missing=1
          fi
          # 2>/dev/null: an absent 404.html was already reported by the loop
          # above, so grep's own complaint is just noise on the failure path.
          if grep -q 'rel="canonical"' dist/404.html 2>/dev/null; then
            echo "::error::404.html still carries a canonical — it will be treated as a duplicate of the homepage"
            missing=1
          fi
          exit $missing
      # IndexNow — tell Bing (and the other IndexNow engines) which URLs
      # changed. Runs against the built dist/, before the artefact is
      # uploaded: submissions only enqueue a crawl, so the site going live a
      # few seconds later is fine. Non-fatal by design — a search-engine ping
      # must never turn a green deploy red (scripts/indexnow.mjs prints the
      # engine's response either way).
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: npm run indexnow
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
