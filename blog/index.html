  <body class="font-sans text-[#141414] antialiased">
    <script>
      // Incoming side of a main site ↔ blog swap: the outgoing page flags the
      // navigation in sessionStorage; cover this page with the 米白 loading
      // screen BEFORE first paint (React hasn't run yet), so the new site
      // never flashes under it. LoadingOverlay fades it out once mounted.
      try {
        if (sessionStorage.getItem("__siteNavFrom")) {
          sessionStorage.removeItem("__siteNavFrom");
          document.body.classList.add("nav-loading");
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
