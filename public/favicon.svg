<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- The avatar: teal field, black pixel face. Square on purpose — the
       squircle corners of avatar.webp go transparent and turn into smudged
       tag-strip corners at 16px, so the icon is redrawn full-bleed on the
       same 32-unit grid the artwork was built on. -->
  <rect width="32" height="32" fill="#01ffcc"/>
  <g fill="#000">
    <rect x="5" y="10" width="2" height="2"/>
    <rect x="25" y="10" width="2" height="2"/>
    <rect x="11" y="12" width="2" height="4"/>
    <rect x="18" y="12" width="2" height="4"/>
    <rect x="11" y="14" width="9" height="2"/>
  </g>
</svg>
