<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photographs — Eververdants</title>
    <script>
      // Apply the visitor's saved sub-site theme BEFORE first paint so a
      // returning visitor never flashes the wrong palette. Shares the same
      // key as the blog sub-site, so one toggle syncs theme everywhere.
      // The photos app (src/photos/components/ThemeToggle.tsx) keeps it in
      // sync from then on; CSS theme tokens key off html[data-theme].
      try {
        if (localStorage.getItem("blog-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="A photographic journal by Eververdants — landscapes, architecture, and quiet rooms."
    />
    <meta name="author" content="Eververdants" />
    <link rel="canonical" href="https://eververdants.github.io/photos/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eververdants" />
    <meta property="og:title" content="Photographs — Eververdants" />
    <meta
      property="og:description"
      content="A photographic journal — landscapes, architecture, and quiet rooms."
    />
    <meta property="og:url" content="https://eververdants.github.io/photos/" />
    <meta
      property="og:image"
      content="https://eververdants.github.io/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eververdants" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Photographs — Eververdants" />
    <meta
      name="twitter:description"
      content="A photographic journal — landscapes, architecture, and quiet rooms."
    />
    <meta
      name="twitter:image"
      content="https://eververdants.github.io/og-image.png"
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Photographs — Eververdants",
        "url": "https://eververdants.github.io/photos/",
        "about": { "@type": "Person", "name": "Eververdants", "alternateName": "万山青未阑" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/photos/main.tsx"></script>
  </body>
</html>
