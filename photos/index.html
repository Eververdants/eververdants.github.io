<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photographs — Eververdants</title>
    <script>
      // Apply the visitor's saved sub-site language & theme BEFORE first
      // paint so a returning visitor never flashes the wrong palette or
      // script. Shares the same keys as the blog/projects sub-sites
      // (blog-lang / blog-theme), so one toggle syncs everywhere; a
      // ?lang=/?theme= URL override wins for the current visit. The photos
      // app (src/photos/lib/prefs.tsx) keeps them in sync from then on.
      try {
        var p = new URLSearchParams(location.search);
        var theme = p.get("theme");
        theme =
          theme === "dark" || theme === "light"
            ? theme
            : localStorage.getItem("blog-theme");
        if (theme === "dark") document.documentElement.dataset.theme = "dark";
        var lang = p.get("lang");
        if (lang === "en" || lang === "zh") document.documentElement.lang = lang;
        else if (localStorage.getItem("blog-lang") === "zh")
          document.documentElement.lang = "zh";
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="A photographic journal by Eververdants — landscapes, architecture, and quiet rooms."
    />
    <meta name="author" content="Eververdants" />
    <link rel="canonical" href="https://eververdants.github.io/photos/" />
